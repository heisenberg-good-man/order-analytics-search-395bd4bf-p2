<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同管理 - 中介平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="app-title">
            <div class="logo">中</div>
            <span>社区服务中介平台</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">服务商管理</a>
            <a href="orders.html">需求管理</a>
            <a href="form.html">入驻资料</a>
            <a href="contracts.html" class="active">合同管理</a>
        </nav>
    </header>

    <main class="app-main">
        <h1 class="page-title">合同管理工作台</h1>

        <div id="stats-container"></div>

        <div class="card">
            <div class="card-title">
                <span>合同列表</span>
            </div>

            <div class="filter-bar">
                <div class="form-group search-group">
                    <label class="form-label">关键词搜索</label>
                    <input type="text" class="form-input" id="keyword" placeholder="合同编号 / 需求标题 / 服务商">
                </div>
                <div class="form-group">
                    <label class="form-label">合同状态</label>
                    <select class="form-select" id="status">
                        <option value="">全部状态</option>
                        <option value="DRAFT">草案中</option>
                        <option value="SIGNED">已签约</option>
                        <option value="REJECTED">已驳回</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">服务类型</label>
                    <select class="form-select" id="professionType">
                        <option value="">全部职业</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">服务城市</label>
                    <select class="form-select" id="cityFilter">
                        <option value="">全部城市</option>
                    </select>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" onclick="loadContracts()">搜索</button>
                    <button class="btn" onclick="resetFilters()" style="margin-left:8px;">重置</button>
                </div>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>合同编号</th>
                        <th>需求标题</th>
                        <th>服务商</th>
                        <th>服务类型</th>
                        <th>服务城市</th>
                        <th>预算</th>
                        <th>状态</th>
                        <th>双方确认</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="contract-list">
                    <tr><td colspan="10" class="empty">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/common.js?v=2"></script>
    <script>
        const CONTRACT_STATUS_MAP = {
            DRAFT: { label: '草案中', class: 'status-tag status-yellow' },
            SIGNED: { label: '已签约', class: 'status-tag status-green' },
            REJECTED: { label: '已驳回', class: 'status-tag status-red' }
        };

        function getContractStatusInfo(status) {
            return CONTRACT_STATUS_MAP[status] || { label: status, class: 'status-tag status-gray' };
        }

        async function loadDict() {
            try {
                const professions = await request('/dict/profession-types');
                const sel = document.getElementById('professionType');
                professions.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.value;
                    opt.textContent = p.label;
                    sel.appendChild(opt);
                });

                const cities = await request('/dict/cities');
                const citySel = document.getElementById('cityFilter');
                cities.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    citySel.appendChild(opt);
                });
            } catch (e) {
                console.error('加载字典失败:', e);
            }
        }

        async function loadStats() {
            try {
                const stats = await request('/contracts/statistics');
                const html = `
                    <div class="stats-grid">
                        <div class="stat-card stat-total">
                            <div class="stat-label">合同总数</div>
                            <div class="stat-value">${stats.total}</div>
                        </div>
                        <div class="stat-card stat-pending">
                            <div class="stat-label">草案中</div>
                            <div class="stat-value">${stats.draft}</div>
                        </div>
                        <div class="stat-card stat-approved">
                            <div class="stat-label">已签约</div>
                            <div class="stat-value">${stats.signed}</div>
                        </div>
                        <div class="stat-card stat-rejected">
                            <div class="stat-label">已驳回</div>
                            <div class="stat-value">${stats.rejected}</div>
                        </div>
                    </div>
                `;
                document.getElementById('stats-container').innerHTML = html;
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        async function loadContracts() {
            const keyword = document.getElementById('keyword').value;
            const status = document.getElementById('status').value;
            const professionType = document.getElementById('professionType').value;
            const city = document.getElementById('cityFilter').value;

            const params = new URLSearchParams();
            if (keyword) params.set('keyword', keyword);
            if (status) params.set('status', status);
            if (professionType) params.set('professionType', professionType);
            if (city) params.set('city', city);

            try {
                const list = await request('/contracts?' + params.toString());
                const tbody = document.getElementById('contract-list');
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="empty">暂无数据</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(c => {
                    const st = getContractStatusInfo(c.status);
                    const providerConf = c.providerConfirmed ? '<span style="color:#52c41a;">✓ 服务商</span>' : '<span style="color:#999;">○ 服务商</span>';
                    const demanderConf = c.demanderConfirmed ? '<span style="color:#52c41a;">✓ 需求方</span>' : '<span style="color:#999;">○ 需求方</span>';
                    return `
                        <tr>
                            <td>${c.id}</td>
                            <td>${c.requirementTitle}</td>
                            <td>${c.providerName}</td>
                            <td>${getProfessionLabel(c.professionType)}</td>
                            <td>${c.city}</td>
                            <td>¥${c.budget}</td>
                            <td><span class="${st.class}">${st.label}</span></td>
                            <td style="font-size:12px;">${providerConf} ${demanderConf}</td>
                            <td>${formatTime(c.createTime)}</td>
                            <td class="actions">
                                <button class="btn btn-sm btn-primary" onclick="goToDetail('${c.id}')">查看详情</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('contract-list').innerHTML =
                    '<tr><td colspan="10" class="empty">加载失败：' + e.message + '</td></tr>';
            }
        }

        function resetFilters() {
            document.getElementById('keyword').value = '';
            document.getElementById('status').value = '';
            document.getElementById('professionType').value = '';
            document.getElementById('cityFilter').value = '';
            loadContracts();
        }

        function goToDetail(id) {
            window.location.href = 'contract-detail.html?id=' + id;
        }

        (async function init() {
            await loadDict();
            await loadStats();
            await loadContracts();
        })();
    </script>
</body>
</html>
